trustPolicy: no-downgrade
trustPolicyExclude:
  - get-tsconfig@4.14.1
  - semver@6.3.1
  - verkit@0.3.2

shellEmulator: true

allowBuilds:
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@conventional-changelog/git-client@2.0.0'
  - handlebars@4.7.9
  - nanoid@3.3.18

overrides:
  '@conventional-changelog/git-client@<2.0.0': ^2.0.0
  nanoid@<3.3.18: ^6.0.0
